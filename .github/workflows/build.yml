
name: Build PS5 13.60 FPKG Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 lld-18 make wget unzip file

      - name: Extract project ZIP
        run: |
          unzip -o FPKG_Enabler_1360_Development.zip
          ls -la FPKG_Enabler_1360_Development

      - name: Install PS5 Payload SDK
        run: |
          wget -q \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -o ps5-payload-sdk.zip -d /opt
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build ELF
        working-directory: FPKG_Enabler_1360_Development
        run: |
          make
          file fpkg_manager_1360.elf

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: PS5-FPKG-Manager-1360
          path: FPKG_Enabler_1360_Development/fpkg_manager_1360.elf
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: FPKG_Enabler_1360_Development/
